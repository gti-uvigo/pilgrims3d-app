  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #ffffff;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <script>
    // Intento de abrir la app si está instalada cuando se visita /poi/*
    (function() {
      try {
        var path = window.location.pathname || '';
        if (path.startsWith('/poi/')) {
          var customUrl = 'pilgrims3d://app' + path + window.location.search;
          var clicked = false;

          // En móviles intentamos abrir el esquema personalizado
          var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
          if (isMobile) {
            // Chrome Android soporta intent URIs que pueden abrir la app directamente si existe
            if (/Android/i.test(navigator.userAgent)) {
              var pkg = 'com.pilgrims_3d';
              var intentUrl = 'intent://' + 'app' + path + window.location.search + '#Intent;scheme=pilgrims3d;package=' + pkg + ';end';
              // Abrir intent, si no existe, el navegador seguirá en web
              window.location.href = intentUrl;
              clicked = true;
            } else {
              // iOS/Safari: usar esquema personalizado
              window.location.href = customUrl;
              clicked = true;
            }

            // Tras 800ms si seguimos en la misma página, continuamos con la carga web
            setTimeout(function(){
              // Si el usuario sigue en esta página, no hacemos nada; Flutter tomará el control.
            }, 800);
          }
        }
      } catch (e) {
        console.warn('Deep-link fallback script error:', e);
      }
    })();
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
