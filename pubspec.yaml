name: pilgrims_3d
description: "An AR app for pilgrims"
publish_to: 'none'
version: 1.0.0+25

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  ar_flutter_plugin_2: ^0.0.3
  vector_math: ^2.1.4
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  flutter_login: ^5.0.0
  font_awesome_flutter: ^10.8.0
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.4
  url_launcher: ^6.3.1
  shared_preferences: ^2.2.0
  http: ^1.2.1
  provider: ^6.0.0
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  flutter_native_splash: ^2.4.6
  google_fonts: ^6.1.0
  dependency_validator: ^3.2.3
  model_viewer_plus: ^1.9.3
  webview_flutter: ^4.0.0
  path_provider: ^2.1.2
  go_router: ^14.0.2
  firebase_messaging: ^15.2.10
  libphonenumber_web: ^0.3.2
  share_plus: ^10.0.2
  crypto: ^3.0.6
  image_picker: ^1.2.0
  mailto: ^2.0.0
  flutter_exif_rotation: ^0.5.1
  vibration: ^2.0.0
  flutter_compass: ^0.8.1
  flutter_svg: ^2.0.10
  sqflite: ^2.3.0
  path: ^1.8.3
  connectivity_plus: ^6.1.0
  flutter_cache_manager: ^3.3.1
  flutter_tts: ^4.2.5
  flutter_background_service: ^5.0.10
  flutter_local_notifications: ^17.0.0
  audioplayers: ^6.0.0

dependency_overrides:
  path_provider_foundation: 2.4.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.5.0



flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/logo_fondo.png"

flutter_native_splash:
  color: "#ffffff"
  image: "images/logo_fondo.png" # Ruta a tu imagen de splash
  android: true
  ios: true



flutter:
  uses-material-design: true
  assets:
    - images/
    - images/flags/
    - data3D/
